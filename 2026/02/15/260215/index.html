ass="line">123</span><br><span class="line">124</span><br><span class="line">125</span><br><span class="line">126</span><br><span class="line">127</span><br><span class="line">128</span><br><span class="line">129</span><br><span class="line">130</span><br><span class="line">131</span><br><span class="line">132</span><br><span class="line">133</span><br><span class="line">134</span><br><span class="line">135</span><br><span class="line">136</span><br><span class="line">137</span><br><span class="line">138</span><br><span class="line">139</span><br></pre></td><td class="code"><pre><span class="line"><span class="comment">#!/usr/bin/env python3</span></span><br><span class="line"><span class="comment"># -*- coding: utf-8 -*-</span></span><br><span class="line"><span class="keyword">import</span> sys</span><br><span class="line"><span class="keyword">import</span> os</span><br><span class="line"><span class="keyword">import</span> ctypes</span><br><span class="line"><span class="keyword">import</span> hashlib</span><br><span class="line"><span class="keyword">import</span> time</span><br><span class="line"><span class="keyword">from</span> pathlib <span class="keyword">import</span> Path</span><br><span class="line"><span class="keyword">from</span> collections <span class="keyword">import</span> defaultdict</span><br><span class="line"></span><br><span class="line"><span class="comment"># === 修复 Windows 中文乱码 ===</span></span><br><span class="line"><span class="keyword">if</span> sys.platform == <span class="string">&#x27;win32&#x27;</span>:</span><br><span class="line">    <span class="keyword">try</span>:</span><br><span class="line">        ctypes.windll.kernel32.SetConsoleOutputCP(<span class="number">65001</span>)</span><br><span class="line">        sys.stdout.reconfigure(encoding=<span class="string">&#x27;utf-8&#x27;</span>)</span><br><span class="line">        sys.stderr.reconfigure(encoding=<span class="string">&#x27;utf-8&#x27;</span>)</span><br><span class="line">    <span class="keyword">except</span>:</span><br><span class="line">        <span class="keyword">pass</span></span><br><span class="line"><span class="comment"># ===========================</span></span><br><span class="line"></span><br><span class="line"><span class="keyword">def</span> <span class="title function_">get_file_hash</span>(<span class="params">filepath, block_size=<span class="number">65536</span></span>):</span><br><span class="line">    <span class="keyword">try</span>:</span><br><span class="line">        hasher = hashlib.md5()</span><br><span class="line">        <span class="keyword">with</span> <span class="built_in">open</span>(filepath, <span class="string">&#x27;rb&#x27;</span>) <span class="keyword">as</span> f:</span><br><span class="line">            <span class="keyword">while</span> chunk := f.read(block_size):</span><br><span class="line">                hasher.update(chunk)</span><br><span class="line">        <span class="keyword">return</span> hasher.hexdigest()</span><br><span class="line">    <span class="keyword">except</span> Exception <span class="keyword">as</span> e:</span><br><span class="line">        <span class="built_in">print</span>(<span class="string">f&quot;⚠️  读取失败: <span class="subst">&#123;filepath&#125;</span> | 错误: <span class="subst">&#123;e&#125;</span>&quot;</span>)</span><br><span class="line">        <span class="keyword">return</span> <span class="literal">None</span></span><br><span class="line"></span><br><span class="line"><span class="keyword">def</span> <span class="title function_">find_duplicates</span>(<span class="params">directory, recursive=<span class="literal">True</span></span>):</span><br><span class="line">    directory = Path(directory).resolve()</span><br><span class="line">    <span class="keyword">if</span> <span class="keyword">not</span> directory.exists():</span><br><span class="line">        <span class="built_in">print</span>(<span class="string">f&quot;❌ 错误: 目录不存在 → <span class="subst">&#123;directory&#125;</span>&quot;</span>)</span><br><span class="line">        <span class="keyword">return</span> &#123;&#125;</span><br><span class="line">    <span class="keyword">if</span> <span class="keyword">not</span> directory.is_dir():</span><br><span class="line">        <span class="built_in">print</span>(<span class="string">f&quot;❌ 错误: 路径不是目录 → <span class="subst">&#123;directory&#125;</span>&quot;</span>)</span><br><span class="line">        <span class="keyword">return</span> &#123;&#125;</span><br><span class="line"></span><br><span class="line">    <span class="built_in">print</span>(<span class="string">f&quot;\n🔍 扫描目录: <span class="subst">&#123;directory&#125;</span>&quot;</span>)</span><br><span class="line">    <span class="built_in">print</span>(<span class="string">f&quot;   递归模式: <span class="subst">&#123;<span class="string">&#x27;是&#x27;</span> <span class="keyword">if</span> recursive <span class="keyword">else</span> <span class="string">&#x27;否&#x27;</span>&#125;</span>&quot;</span>)</span><br><span class="line">    <span class="built_in">print</span>(<span class="string">&quot;-&quot;</span> * <span class="number">60</span>)</span><br><span class="line"></span><br><span class="line">    <span class="comment"># 按大小分组</span></span><br><span class="line">    size_groups = defaultdict(<span class="built_in">list</span>)</span><br><span class="line">    scanned = <span class="number">0</span></span><br><span class="line">    <span class="keyword">try</span>:</span><br><span class="line">        <span class="keyword">for</span> root, dirs, files <span class="keyword">in</span> os.walk(directory, followlinks=<span class="literal">False</span>):</span><br><span class="line">            <span class="keyword">if</span> <span class="keyword">not</span> recursive:</span><br><span class="line">                dirs.clear()</span><br><span class="line">            <span class="keyword">for</span> name <span class="keyword">in</span> files:</span><br><span class="line">                path = Path(root) / name</span><br><span class="line">                <span class="keyword">try</span>:</span><br><span class="line">                    <span class="keyword">if</span> path.is_symlink() <span class="keyword">or</span> <span class="keyword">not</span> path.is_file():</span><br><span class="line">                        <span class="keyword">continue</span></span><br><span class="line">                    size = path.stat().st_size</span><br><span class="line">                    size_groups[size].append(<span class="built_in">str</span>(path.resolve()))</span><br><span class="line">                    scanned += <span class="number">1</span></span><br><span class="line">                <span class="keyword">except</span> Exception:</span><br><span class="line">                    <span class="keyword">continue</span></span><br><span class="line">    <span class="keyword">except</span> Exception <span class="keyword">as</span> e:</span><br><span class="line">        <span class="built_in">print</span>(<span class="string">f&quot;❌ 扫描出错: <span class="subst">&#123;e&#125;</span>&quot;</span>)</span><br><span class="line">        <span class="keyword">return</span> &#123;&#125;</span><br><span class="line"></span><br><span class="line">    <span class="built_in">print</span>(<span class="string">f&quot;✅ 扫描完成: 共 <span class="subst">&#123;scanned&#125;</span> 个文件，<span class="subst">&#123;<span class="built_in">len</span>(size_groups)&#125;</span> 种大小&quot;</span>)</span><br><span class="line">    <span class="built_in">print</span>(<span class="string">&quot;-&quot;</span> * <span class="number">60</span>)</span><br><span class="line"></span><br><span class="line">    <span class="comment"># 计算哈希</span></span><br><span class="line">    hash_groups = defaultdict(<span class="built_in">list</span>)</span><br><span class="line">    total_groups = <span class="built_in">sum</span>(<span class="number">1</span> <span class="keyword">for</span> g <span class="keyword">in</span> size_groups.values() <span class="keyword">if</span> <span class="built_in">len</span>(g) &gt; <span class="number">1</span>)</span><br><span class="line">    processed = <span class="number">0</span></span><br><span class="line">    <span class="keyword">for</span> size, files <span class="keyword">in</span> size_groups.items():</span><br><span class="line">        <span class="keyword">if</span> <span class="built_in">len</span>(files) &lt;= <span class="number">1</span>:</span><br><span class="line">            <span class="keyword">continue</span></span><br><span class="line">        processed += <span class="number">1</span></span><br><span class="line">        <span class="built_in">print</span>(<span class="string">f&quot;[<span class="subst">&#123;processed&#125;</span>/<span class="subst">&#123;total_groups&#125;</span>] 比对 <span class="subst">&#123;<span class="built_in">len</span>(files)&#125;</span> 个 <span class="subst">&#123;size&#125;</span>B 的文件...&quot;</span>, end=<span class="string">&#x27;\r&#x27;</span>)</span><br><span class="line">        hashes = defaultdict(<span class="built_in">list</span>)</span><br><span class="line">        <span class="keyword">for</span> f <span class="keyword">in</span> files:</span><br><span class="line">            h = get_file_hash(f)</span><br><span class="line">            <span class="keyword">if</span> h:</span><br><span class="line">                hashes[h].append(f)</span><br><span class="line">        <span class="keyword">for</span> h, paths <span class="keyword">in</span> hashes.items():</span><br><span class="line">            <span class="keyword">if</span> <span class="built_in">len</span>(paths) &gt; <span class="number">1</span>:</span><br><span class="line">                hash_groups[h].extend(paths)</span><br><span class="line">    <span class="built_in">print</span>(<span class="string">&quot;\n✅ 哈希比对完成&quot;</span>)</span><br><span class="line">    <span class="built_in">print</span>(<span class="string">&quot;=&quot;</span> * <span class="number">60</span>)</span><br><span class="line">    <span class="keyword">return</span> hash_groups</span><br><span class="line"></span><br><span class="line"><span class="keyword">def</span> <span class="title function_">main</span>():</span><br><span class="line">    <span class="built_in">print</span>(<span class="string">&quot;=&quot;</span> * <span class="number">60</span>)</span><br><span class="line">    <span class="built_in">print</span>(<span class="string">&quot;📁 重复文件检测工具（中文修复版）&quot;</span>)</span><br><span class="line">    <span class="built_in">print</span>(<span class="string">&quot;=&quot;</span> * <span class="number">60</span>)</span><br><span class="line"></span><br><span class="line">    <span class="comment"># 自动使用脚本所在目录</span></span><br><span class="line">    default_dir = Path(__file__).parent.resolve()</span><br><span class="line">    <span class="built_in">print</span>(<span class="string">f&quot;\n💡 默认扫描目录: <span class="subst">&#123;default_dir&#125;</span>&quot;</span>)</span><br><span class="line">    <span class="built_in">print</span>(<span class="string">&quot;   按 Enter 直接使用该目录，或输入其他路径:&quot;</span>)</span><br><span class="line"></span><br><span class="line">    <span class="keyword">try</span>:</span><br><span class="line">        user_input = <span class="built_in">input</span>(<span class="string">&quot;📁 输入目录路径: &quot;</span>).strip()</span><br><span class="line">        target_dir = user_input <span class="keyword">if</span> user_input <span class="keyword">else</span> <span class="built_in">str</span>(default_dir)</span><br><span class="line">    <span class="keyword">except</span> KeyboardInterrupt:</span><br><span class="line">        <span class="built_in">print</span>(<span class="string">&quot;\n🛑 操作被取消&quot;</span>)</span><br><span class="line">        wait_exit()</span><br><span class="line">        <span
